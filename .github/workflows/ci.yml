name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install production lock and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest tests -q

  docker:
    name: Docker build and offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build the real production Dockerfile; do not push images or deploy.
      - name: Build production image
        run: docker build --pull --tag discord-stock-bot:ci .
      - name: Check installed image dependencies
        run: docker run --rm --network none --entrypoint python discord-stock-bot:ci -m pip check
      - name: Import application and check local health routes
        run: |
          docker run --rm --network none --entrypoint python discord-stock-bot:ci -c "from importlib.metadata import version; import discord, asyncpg, yfinance; from bot import app; assert version('yolab-quote') == '0.1.1'; client = app.test_client(); assert client.get('/live').status_code == 200; assert client.get('/health').status_code == 503"
